name: Run Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          version: 12.14.0
          runtime: node@24
      - run: pnpm install
      - run: npx playwright install
      - run: pnpm test

  # The devDependencies pin @langfuse/* 6.x; rerun the Langfuse bridge tests
  # against the older majors it supports (>= 4).
  langfuse-bridge-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langfuse: ["5.14.0", "4.6.1"]
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/setup@v3.1.1
        with:
          version: 12.14.0
          runtime: node@24
      - run: pnpm install
      - name: Install @langfuse/* ${{ matrix.langfuse }}
        run: >-
          pnpm --filter @lmnr-ai/lmnr add -D -E
          @langfuse/core@${{ matrix.langfuse }}
          @langfuse/tracing@${{ matrix.langfuse }}
          @langfuse/otel@${{ matrix.langfuse }}
          @langfuse/openai@${{ matrix.langfuse }}
          @langfuse/langchain@${{ matrix.langfuse }}
      - name: Run Langfuse bridge tests
        working-directory: packages/lmnr
        run: pnpm exec tsx --test test/langfuse-bridge.test.ts
