name: Run Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/setup@v3.1.1
        with:
          version: 12.14.0
          runtime: node@24
      - run: pnpm install
      - run: npx playwright install
      - run: pnpm test
