name: Check lint

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  check-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/setup@v3.1.1 # immutable tag
        with:
          version: 12.14.0
          runtime: node@24
      - run: pnpm install
      - run: pnpm lint
